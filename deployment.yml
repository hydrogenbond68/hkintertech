apiVersion: apps/v1
kind: Deployment
metadata:
  name: hkintertech-frontend
  labels:
    app: hkintertech
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hkintertech
      tier: frontend
  template:
    metadata:
      labels:
        app: hkintertech
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: hkintertech/frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_URL
              value: "https://hkintertech.com/api"
            - name: FRONTEND_URL
              value: "https://hkintertech.com"
          resources:
            requests:
              cpu: "125m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hkintertech-backend
  labels:
    app: hkintertech
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hkintertech
      tier: backend
  template:
    metadata:
      labels:
        app: hkintertech
        tier: backend
    spec:
      containers:
        - name: backend
          image: hkintertech/backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            # Secrets must be supplied out of band (e.g. a mounted Secret or an
            # external secrets operator); the API refuses to start in production
            # without JWT_SECRET of at least 32 characters.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hkintertech-secrets
                  key: JWT_SECRET
            - name: EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: hkintertech-secrets
                  key: EMAIL_USER
            - name: EMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: hkintertech-secrets
                  key: EMAIL_PASS
            - name: MPESA_SHORTCODE
              valueFrom:
                secretKeyRef:
                  name: hkintertech-secrets
                  key: MPESA_SHORTCODE
                  optional: true
            - name: MPESA_PASSKEY
              valueFrom:
                secretKeyRef:
                  name: hkintertech-secrets
                  key: MPESA_PASSKEY
                  optional: true
          envFrom:
            - configMapRef:
                name: hkintertech-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            # Gates traffic on Mongo + Redis actually being usable. Liveness
            # stays on /health so a Redis blip drains pods without restart-looping.
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hkintertech-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hkintertech-backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hkintertech-frontend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hkintertech-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hkintertech-nginx
  labels:
    app: hkintertech
    tier: proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hkintertech
      tier: proxy
  template:
    metadata:
      labels:
        app: hkintertech
        tier: proxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

---
# Split into per-tier Services. A single Service selecting only `app: hkintertech`
# matched the frontend, proxy, and database pods, so port 5000 was load-balanced
# to containers that do not serve the API.
apiVersion: v1
kind: Service
metadata:
  name: hkintertech-frontend
spec:
  type: ClusterIP
  selector:
    app: hkintertech
    tier: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: hkintertech-backend
spec:
  type: ClusterIP
  selector:
    app: hkintertech
    tier: backend
  ports:
    - name: api
      port: 5000
      targetPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: hkintertech-proxy
spec:
  type: ClusterIP
  selector:
    app: hkintertech
    tier: proxy
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: hkintertech-mongo
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: hkintertech
    tier: database
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017

---
apiVersion: v1
kind: Service
metadata:
  name: hkintertech-redis
spec:
  type: ClusterIP
  selector:
    app: hkintertech
    tier: cache
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hkintertech-config
data:
  MONGO_URI: "mongodb://hkintertech-mongo:27017/hk-intertech"
  REDIS_URL: "redis://hkintertech-redis:6379"
  NODE_ENV: "production"
  # Required in production: the API refuses to start without an explicit
  # allow-list (see backend/config/cors.js).
  CORS_ORIGINS: "https://hkintertech.com,https://www.hkintertech.com"
  FRONTEND_URL: "https://hkintertech.com"
  API_RATE_LIMIT: "600"
  AUTH_RATE_LIMIT: "40"

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: hkintertech
      tier: database
  template:
    metadata:
      labels:
        app: hkintertech
        tier: database
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: "hk-intertech"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hkintertech
      tier: cache
  template:
    metadata:
      labels:
        app: hkintertech
        tier: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

---
# Operational notes (documentation only - not applied to the cluster).
#
# Redis is required for catalog caching, cross-instance rate limiting, and the
# Socket.IO adapter. Without it the API still boots but degrades: /ready returns
# 503 and order events do not cross pod boundaries.
#
# Socket.IO requires sticky sessions so a client stays on one backend pod, and
# CORS_ORIGINS must match the public frontend origin exactly.
